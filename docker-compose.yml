services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: osa_agent_world
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osa_agent_world"]
      interval: 2s
      timeout: 3s
      retries: 20
